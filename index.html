<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Uniformidad · Grupo Scout Mansaborá 738</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecera">
    <div class="envoltura cabecera-fila">
      <div class="marca">
        <span class="marca-sello" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 3 3 6l2 4.5 3-1.4V21h8V9.1l3 1.4L21 6l-5.5-3c-.4 1.7-1.7 2.8-3.5 2.8S8.9 4.7 8.5 3z"/></svg>
        </span>
        <div>
          <small>Grupo Scout Mansaborá 738</small>
          <b>Uniformidad</b>
        </div>
      </div>

      <nav class="pestanas" aria-label="Secciones">
        <button class="nav activa" data-tab="stock">Inventario</button>
        <button class="nav" data-tab="personas">Personas <span class="contador" id="contador-personas">0</span></button>
        <button class="nav" data-tab="camisas">Camisas <span class="contador" id="contador-camisas">0</span></button>
      </nav>

      <details class="menu-datos">
        <summary>Datos</summary>
        <div class="menu-lista">
          <button id="excel" class="copia">Exportar a Excel</button>
          <button id="sheets" class="copia">Enviar a Google Sheets</button>
          <button id="sheets-url" class="copia enlace">Cambiar enlace de Sheets</button>
          <hr>
          <button id="exportar" class="copia">Descargar copia de seguridad</button>
          <label class="copia">Restaurar copia…<input type="file" id="importar" accept=".json" hidden></label>
        </div>
      </details>
    </div>
  </header>

  <div class="envoltura">
    <div class="portada">
      <div>
        <p class="antetitulo" id="fecha"></p>
        <h1 id="titulo">Inventario</h1>
        <p id="subtitulo">Existencias de camisetas, sudaderas y pañoletas</p>
      </div>
      <p class="leyenda" aria-label="Leyenda">
        <span><i class="cuadro ok"></i>Entregado y pagado</span>
        <span><i class="cuadro debe"></i>Debe</span>
        <span><i class="cuadro pend"></i>Pendiente de stock</span>
      </p>
    </div>

    <main>
      <section id="stock" class="panel">
        <div id="stock-contenido"></div>
      </section>

      <section id="personas" class="panel" hidden>
        <div class="herramientas">
          <form id="form-persona" class="alta">
            <label class="oculto" for="nombre">Nombre de la nueva persona</label>
            <input id="nombre" placeholder="Nombre de la nueva persona" required autocomplete="off">
            <button class="primario">+ Nueva ficha</button>
          </form>
          <div class="buscador">
            <label class="oculto" for="buscar">Buscar persona</label>
            <input id="buscar" placeholder="Buscar persona…" autocomplete="off">
          </div>
        </div>
        <div class="filtros" id="filtros"></div>
        <div id="lista-personas" class="rejilla"></div>
      </section>

      <section id="camisas" class="panel" hidden>
        <form id="form-camisa" class="alta alta-camisa">
          <label class="campo">Niño/a<input id="c-nombre" placeholder="Nombre" required autocomplete="off"></label>
          <label class="campo corto">Talla<select id="c-talla"></select></label>
          <label class="campo">Sección<input id="c-seccion" placeholder="Lobatos, Scouts…" list="lista-secciones" required autocomplete="off"></label>
          <label class="campo corto">Pago<select id="c-metodo"></select></label>
          <label class="check-pago"><input type="checkbox" id="c-pagado"> Ya pagado</label>
          <button class="primario">+ Nuevo pedido</button>
          <datalist id="lista-secciones">
            <option value="Castores"><option value="Lobatos"><option value="Scouts"><option value="Escultas"><option value="Rovers">
          </datalist>
        </form>
        <div class="herramientas">
          <div class="buscador">
            <label class="oculto" for="c-buscar">Buscar niño o sección</label>
            <input id="c-buscar" placeholder="Buscar niño o sección…" autocomplete="off">
          </div>
        </div>
        <div class="filtros" id="c-filtros"></div>
        <div id="resumen-camisas"></div>
        <div id="lista-camisas" class="rejilla"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
